<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projects — Ahmad Zeeb</title>
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/animations.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>

  <body>

    <!-- ===== NAVBAR ===== -->
    <nav id="navbar">
      <a class="nav-logo" href="index.html">AZ</a>
      <div class="nav-links">
        <a href="education.html"  data-i18n="nav.education">Education</a>
        <a href="experience.html" data-i18n="nav.experience">Experience</a>
        <a href="projects.html"   class="nav-active" data-i18n="nav.projects">Projects</a>
      </div>
      <div class="nav-actions">
        <button id="theme-toggle" aria-label="Toggle theme">☀️</button>
        <button id="lang-toggle"  aria-label="Switch language">SV</button>
        <button id="chat-toggle"  aria-label="Open chat" data-i18n="nav.chat">Chat with me</button>
      </div>
    </nav>

    <!-- ===== PAGE HEADER ===== -->
    <section class="page-header">
      <div class="page-header-content">
        <p class="page-breadcrumb"><a href="index.html">Home</a> / <span data-i18n="nav.projects">Projects</span></p>
        <h1 data-i18n="nav.projects">Projects</h1>
        <p data-i18n="projects.subtitle">Things I've built</p>
      </div>
    </section>

    <!-- ===== CONTENT ===== -->
    <main class="page-main">
      <div class="section-container">

        <div class="projects-grid reveal">
          <!-- Project cards will be added here -->
        </div>

        <div class="empty-state reveal">
          <p class="empty-icon">🚧</p>
          <p data-i18n="projects.coming_soon">More projects coming soon.</p>
        </div>

      </div>
    </main>

    <!-- ===== FOOTER ===== -->
    <footer id="footer">
      <p data-i18n="footer.copy">&copy; 2025 Ahmad Zeeb. All rights reserved.</p>
      <a href="index.html" id="back-to-top" data-i18n="footer.back_home">Back to home ↩</a>
    </footer>

    <!-- ===== CHATBOT ===== -->
    <div id="chatbot-widget">
      <div id="chat-window">
        <div id="chat-header">
          <span data-i18n="chat.title">Ask me about Ahmad</span>
          <button id="close-chat" aria-label="Close chat">&times;</button>
        </div>
        <div id="chat-messages"></div>
        <div id="chat-input-area">
          <input type="text" id="chat-input" placeholder="Ask something..." data-i18n-placeholder="chat.placeholder" />
          <button id="chat-send" aria-label="Send">&#9658;</button>
        </div>
      </div>
      <button id="chat-fab" aria-label="Toggle chat">💬</button>
    </div>

    <!-- JS -->
    <script src="data/translations.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/chatbot.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
